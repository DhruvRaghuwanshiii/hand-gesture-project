system:
  camera_index: 0
  confidence_threshold: 0.75
  smoothing_window: 3
  exit_gesture: "pinky_up"
  exit_hold_seconds: 2.0

mouse:
  enabled_gesture: "pointing"
  smoothing_factor: 0.55
  frame_margin: 0.18
  pinch_threshold: 0.045
  click_cooldown: 0.4

profiles:
  media:
    continuous_cooldown: 0.12
    discrete_cooldown: 1.2
    volume_step: 3
    bindings:
      thumbs_up: { type: "continuous", action: "volumeup", label: "Volume Up" }
      fist:      { type: "continuous", action: "volumedown", label: "Volume Down" }
      open_palm: { type: "discrete",   action: "playpause", label: "Play / Pause" }
      peace:     { type: "discrete",   action: "screenshot", label: "Screenshot" }

  presentation:
    continuous_cooldown: 0.5
    discrete_cooldown: 1.0
    volume_step: 1
    bindings:
      thumbs_up: { type: "discrete", action: "right", label: "Next Slide" }
      fist:      { type: "discrete", action: "left", label: "Previous Slide" }
      open_palm: { type: "discrete", action: "f5", label: "Start Slideshow" }
      peace:     { type: "discrete", action: "esc", label: "Exit Slideshow" }